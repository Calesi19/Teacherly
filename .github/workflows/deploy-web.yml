name: deploy-web

# Deploys the web app (web/) to Fly.io on every push that touches it.
# The desktop app at the repository root is not involved.
# Requires the FLY_API_TOKEN repository secret (a deploy token scoped to
# the `teacherly` app).

on:
  workflow_dispatch:
  push:
    branches: [main, web/chunk-1-skeleton-auth]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        working-directory: web
        run: flyctl deploy --remote-only --app teacherly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
